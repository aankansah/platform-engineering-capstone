version: "3.8"

services:
  task-dashboard:
    build:
      context: ./task-dashboard
      dockerfile: Dockerfile
    image: platform-task-dashboard:latest
    ports:
      - "3000:80"
    restart: unless-stopped

  task-api:
    build:
      context: ./task-api
      dockerfile: Dockerfile
    image: platform-task-api:latest
    ports:
      - "4000:4000"
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    restart: unless-stopped

  task-validator:
    build:
      context: ./task-validator
      dockerfile: Dockerfile
    image: platform-task-validator:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    restart: unless-stopped
    
  task-enricher:
    build:
      context: ./task-enricher
      dockerfile: Dockerfile
    image: platform-task-enricher:latest
    ports:
      - "8081:8080"
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
    restart: unless-stopped

  zookeeper:
    image: bitnami/zookeeper:3
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    restart: unless-stopped

version: "3.8"

services:
  task-dashboard:
    build:
      context: ./task-dashboard
      dockerfile: Dockerfile
    image: platform-task-dashboard:latest
    ports:
      - "3000:80"
    restart: unless-stopped

  task-api:
    build:
      context: ./task-api
      dockerfile: Dockerfile
    image: platform-task-api:latest
    ports:
      - "4000:4000"
    environment:
      - KAFKA_BROKERS=${KAFKA_BROKERS:-localhost:9092}
    restart: unless-stopped

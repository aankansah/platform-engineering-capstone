global:
  environment: production
  imagePullPolicy: IfNotPresent

taskDashboard:
  enabled: true
  replicaCount: 3

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-dashboard
    tag: latest

  service:
    type: ClusterIP
    port: 3000
    targetPort: 80

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10

  volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
    - name: nginx-tmp
      mountPath: /tmp

  volumes:
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
    - name: nginx-tmp
      emptyDir: {}

taskGateway:
  enabled: true
  replicaCount: 2

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-gateway
    tag: latest

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

taskValidator:
  enabled: true
  replicaCount: 2

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-validator
    tag: latest

  service:
    type: ClusterIP
    port: 8081
    targetPort: 8080

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15

  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10

taskEnricher:
  enabled: true
  replicaCount: 2

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-enricher
    tag: latest

  service:
    type: ClusterIP
    port: 8082
    targetPort: 8080

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 15
    targetCPUUtilizationPercentage: 80

  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10

networkPolicies:
  enabled: true

podDisruptionBudget:
  enabled: true

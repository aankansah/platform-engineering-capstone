global:
  environment: dev
  imagePullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-registry-secret

taskDashboard:
  enabled: true
  replicaCount: 1

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-dashboard
    tag: latest
    imagePullPolicy: Always

  service:
    type: ClusterIP
    port: 3000
    targetPort: 80

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10

  volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
    - name: nginx-tmp
      mountPath: /tmp

  volumes:
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
    - name: nginx-tmp
      emptyDir: {}

taskGateway:
  enabled: true
  replicaCount: 1

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-gateway
    tag: latest
    imagePullPolicy: Always

  env:
    - name: KAFKA_BROKERS
      value: ent-kafka-kafka-bootstrap:9092
    - name: KAFKA_CLIENT_ID
      value: task-gateway
    - name: KAFKA_GROUP_ID
      value: task-gateway-group
    - name: TOPIC_TASKS
      value: tasks
    - name: TOPIC_EVENTS
      value: task-events
    - name: TOPIC_TASK_EVENTS
      value: task-events

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

taskValidator:
  enabled: true
  replicaCount: 1

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-validator
    tag: latest
    imagePullPolicy: Always

  env:
    - name: KAFKA_BROKERS
      value: ent-kafka-kafka-bootstrap:9092
    - name: APPLICATION_TOPICS_EVENTS
      value: task-events
    - name: SERVER_PORT
      value: "8080"

  service:
    type: ClusterIP
    port: 8081
    targetPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15

  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10

taskEnricher:
  enabled: true
  replicaCount: 1

  image:
    repository: 912951360942.dkr.ecr.us-east-1.amazonaws.com/ent-aws-capstone/task-enricher
    tag: latest
    imagePullPolicy: Always

  env:
    - name: KAFKA_BROKERS
      value: ent-kafka-kafka-bootstrap:9092
    - name: TOPIC_TASKS
      value: tasks
    - name: TOPIC_TASK_EVENTS
      value: task-events
    - name: LISTEN_ADDR
      value: 0.0.0.0:8080

  service:
    type: ClusterIP
    port: 8082
    targetPort: 8080

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10

kafka:
  enabled: true
  name: ent-kafka
  # No image needed because Strimzi chooses the Kafka image from the strimzi operator installed based on the version number passed
  version: 4.3.0
  replicas: 1
  storage:
    type: ephemeral

kafkaUi:
  enabled: true
  image: provectuslabs/kafka-ui:latest
  service:
    port: 8080

networkPolicies:
  enabled: false

podDisruptionBudget:
  enabled: false

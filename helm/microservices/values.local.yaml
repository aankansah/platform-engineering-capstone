# Local Kind values.
# These images must match scripts/kind-build-load-all-services.sh because Kind
# runs inside Docker nodes and can only use images that were loaded into that
# cluster or pulled from a registry.
global:
  environment: local
  # Never makes local failures obvious: if the image was not loaded into Kind,
  # Kubernetes fails fast instead of trying Docker Hub for task-dashboard:local.
  imagePullPolicy: Never

# The dashboard container serves static assets through nginx on port 80, while
# the local workflow exposes the app through Service port 3000 for familiarity.
taskDashboard:
  enabled: true
  replicaCount: 1

  image:
    repository: task-dashboard
    tag: local

  service:
    type: ClusterIP
    port: 3000
    targetPort: 80

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /healthz
    initialDelaySeconds: 30
    periodSeconds: 10

  # nginx runs as a non-root user in the chart, so its runtime write paths need
  # ephemeral volumes instead of writing into the image filesystem.
  volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
    - name: nginx-tmp
      mountPath: /tmp

  volumes:
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
    - name: nginx-tmp
      emptyDir: {}

# The gateway image name is intentionally unqualified so Kubernetes uses the
# image loaded into the Kind node, not ECR.
taskGateway:
  enabled: true
  replicaCount: 1

  image:
    repository: task-gateway
    tag: local

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

taskValidator:
  enabled: true
  replicaCount: 1

  image:
    repository: task-validator
    tag: local

  service:
    type: ClusterIP
    port: 8081
    targetPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 15

  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10

taskEnricher:
  enabled: true
  replicaCount: 1

  image:
    repository: task-enricher
    tag: local

  service:
    type: ClusterIP
    port: 8082
    targetPort: 8080

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  livenessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10

  # Readiness is useful locally because the service can be running while Kafka
  # is still starting; traffic should wait until dependency checks pass.
  readinessProbe:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10

networkPolicies:
  # Local Kind clusters often do not enforce NetworkPolicy unless a supporting
  # CNI is installed; keeping this on matches EKS behavior when supported.
  enabled: true

podDisruptionBudget:
  # A single-node local cluster cannot satisfy multi-pod disruption guarantees.
  enabled: false

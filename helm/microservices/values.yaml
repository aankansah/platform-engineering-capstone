global:
  imageRegistry: "912951360942.dkr.ecr.us-east-1.amazonaws.com"
  environment: dev
  imagePullPolicy: IfNotPresent

# ── JavaScript API ──────────────────────────────────────────────────────────
javascriptApi:
  enabled: true
  replicaCount: 1

  image:
    repository: capstone/javascript-api
    tag: latest

  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

# ── Java Service ────────────────────────────────────────────────────────────
javaService:
  enabled: true
  replicaCount: 1

  image:
    repository: capstone/java-service
    tag: latest

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  livenessProbe:
    path: /actuator/health
    initialDelaySeconds: 60 # Spring Boot starts slowly
    periodSeconds: 15

  readinessProbe:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10

# ── Rust Processor ──────────────────────────────────────────────────────────
rustProcessor:
  enabled: true
  replicaCount: 1

  image:
    repository: capstone/rust-processor
    tag: latest

  service:
    type: ClusterIP
    port: 80
    targetPort: 8090

  resources:
    requests:
      memory: "64Mi" # Rust is very lean on memory
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

networkPolicies:
  enabled: true

podDisruptionBudget:
  enabled: false # Enabled in staging and production values

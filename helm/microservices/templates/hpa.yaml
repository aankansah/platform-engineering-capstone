{{/*
  Build HorizontalPodAutoscalers for services that opt in through values.yaml.
  HPAs scale replicas based on observed metrics, so they should own replica
  counts instead of fighting with a fixed Deployment replicas field.
*/}}
{{- $services := dict
  "task-dashboard" .Values.taskDashboard
  "task-enricher" .Values.taskEnricher
  "task-gateway" .Values.taskGateway
  "task-validator" .Values.taskValidator
-}}

{{/* Only render HPAs for enabled services with autoscaling.enabled=true. */}}
{{- range $name, $config := $services }}
{{- if and $config.enabled $config.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-hpa
spec:
  scaleTargetRef:
    # The HPA controls this Deployment's replica count through the scale subresource.
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}

  # Bounds prevent autoscaling from shrinking below resilience requirements or
  # growing beyond expected cost/capacity limits.
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}

  metrics:
    - type: Resource
      resource:
        # CPU utilization requires resource requests on the Deployment. Without
        # requests, Kubernetes cannot calculate percentage utilization correctly.
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $config.autoscaling.targetCPUUtilizationPercentage }}

  behavior:
    scaleDown:
      # Scale down slowly to avoid flapping during short traffic dips.
      stabilizationWindowSeconds: 300 # Wait 5 min before scale-down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

    scaleUp:
      # Scale up immediately when demand increases; user-facing latency usually
      # suffers more from under-provisioning than brief over-provisioning.
      stabilizationWindowSeconds: 0 # Scale up immediately
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
{{- end }}
{{- end }}

{{- if .Values.networkPolicies.enabled }}
---
# Default deny all ingress and egress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.global.environment }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow JavaScript API to receive external traffic and call Java service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: javascript-api-policy
spec:
  podSelector:
    matchLabels:
      app: javascript-api

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

  egress:
    # Allow calling Java service
    - to:
        - podSelector:
            matchLabels:
              app: java-service
      ports:
        - protocol: TCP
          port: 8080

    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow outbound HTTPS (ECR, AWS APIs)
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# Allow Java service to receive from JavaScript API and call Rust processor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: java-service-policy
spec:
  podSelector:
    matchLabels:
      app: java-service

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: javascript-api
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Allow calling Rust processor
    - to:
        - podSelector:
            matchLabels:
              app: rust-processor
      ports:
        - protocol: TCP
          port: 8090

    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow outbound HTTPS (ECR, AWS APIs)
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if .Values.networkPolicies.enabled }}
---
# Default deny all ingress and egress in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.global.environment }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Allow Task Dashboard to receive external traffic and call Task Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-dashboard-policy
spec:
  podSelector:
    matchLabels:
      app: task-dashboard

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80

  egress:
    # Allow calling Task Gateway
    - to:
        - podSelector:
            matchLabels:
              app: task-gateway
      ports:
        - protocol: TCP
          port: 8080

    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow outbound HTTPS (ECR, AWS APIs)
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# Allow Task Gateway to receive dashboard traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-gateway-policy
spec:
  podSelector:
    matchLabels:
      app: task-gateway

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: task-dashboard
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow outbound HTTPS (ECR, AWS APIs)
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# Allow Task Validator platform egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-validator-policy
spec:
  podSelector:
    matchLabels:
      app: task-validator

  policyTypes:
    - Egress

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow outbound HTTPS (ECR, AWS APIs)
    - to: []
      ports:
        - protocol: TCP
          port: 443

---
# Allow Task Enricher platform egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-enricher-policy
spec:
  podSelector:
    matchLabels:
      app: task-enricher

  policyTypes:
    - Egress

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow outbound HTTPS (ECR, AWS APIs)
    - to: []
      ports:
        - protocol: TCP
          port: 443
{{- end }}

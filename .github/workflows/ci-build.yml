name: CI — Build & Test All Services

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_PREFIX: ent-aws-capstone

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      task_dashboard: ${{ steps.filter.outputs.task_dashboard }}
      task_gateway: ${{ steps.filter.outputs.task_gateway }}
      task_validator: ${{ steps.filter.outputs.task_validator }}
      task_enricher: ${{ steps.filter.outputs.task_enricher }}
      deploy_all: ${{ steps.filter.outputs.deploy_all }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect service changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            task_dashboard:
              - 'services/task-dashboard/**'
            task_gateway:
              - 'services/task-gateway/**'
            task_validator:
              - 'services/task-validator/**'
            task_enricher:
              - 'services/task-enricher/**'
            deploy_all:
              - 'helm/**'
              - 'terraform/**'
              - '.github/workflows/**'

  build-task-dashboard:
    name: Build Task Dashboard
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.task_dashboard == 'true' || needs.detect-changes.outputs.deploy_all == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/task-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: services/task-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-dashboard:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-dashboard:latest \
            .

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-dashboard:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-dashboard:latest

  build-task-gateway:
    name: Build Task Gateway
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.task_gateway == 'true' || needs.detect-changes.outputs.deploy_all == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/task-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: services/task-gateway/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run --if-present lint

      - name: Run tests
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-gateway:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-gateway:latest \
            .

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-gateway:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-gateway:latest

  build-task-validator:
    name: Build Task Validator
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.task_validator == 'true' || needs.detect-changes.outputs.deploy_all == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/task-validator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn clean verify -q

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-validator:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-validator:latest \
            .

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-validator:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-validator:latest

  build-task-enricher:
    name: Build Task Enricher
    needs: detect-changes
    if: github.event_name == 'push' || needs.detect-changes.outputs.task_enricher == 'true' || needs.detect-changes.outputs.deploy_all == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/task-enricher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/task-enricher/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/task-enricher/Cargo.lock') }}

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-enricher:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-enricher:latest \
            .

          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-enricher:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_PREFIX }}/task-enricher:latest
